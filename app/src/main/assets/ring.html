<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font-family:system-ui,sans-serif;color:#3b3350;background:linear-gradient(#ffe9d6,#f6d6e6 55%,#d9cdf5);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;animation:in 4s ease}
@keyframes in{from{opacity:0}}
svg{width:210px;height:210px;animation:float 6s ease-in-out infinite,glow 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px)}}@keyframes glow{50%{filter:drop-shadow(0 0 30px #fff)}}
.time{font-size:56px;font-weight:300}h1{margin:0;font-size:26px}p{margin:0;font-size:18px;max-width:300px}
button{border:0;border-radius:18px;padding:14px 22px;font:inherit;font-weight:700;background:#fff;color:#3b3350;margin:4px}
#ok{background:#f2a6b8}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<svg viewBox="0 0 160 160"><defs><radialGradient id="g" cx=".38" cy=".3"><stop offset="0" stop-color="#fff0f4"/><stop offset=".6" stop-color="#f7b7c8"/><stop offset="1" stop-color="#ee94ae"/></radialGradient></defs>
<circle cx="38" cy="50" r="15" fill="#f4a3ba"/><circle cx="122" cy="50" r="15" fill="#f4a3ba"/><path d="M80 36V20" stroke="#b9a7e8" stroke-width="4" stroke-linecap="round"/><circle cx="80" cy="14" r="9" fill="#ffd16b"/>
<ellipse cx="80" cy="92" rx="58" ry="52" fill="url(#g)"/>
<path d="M48 90q10-10 20 0M92 90q10-10 20 0" stroke="#3b3350" stroke-width="4.5" fill="none" stroke-linecap="round"/>
<circle cx="42" cy="106" r="9" fill="#f78fa7" opacity=".45"/><circle cx="118" cy="106" r="9" fill="#f78fa7" opacity=".45"/>
<path d="M68 108q12 12 24 0" stroke="#3b3350" stroke-width="3.5" fill="none" stroke-linecap="round"/></svg>
<div class="time" id="clock"></div><h1 id="ti"></h1><p id="la"></p>
<div><button id="sn">Encore 5 min</button><button id="ok">Je suis réveillé·e</button></div>
<script src="melodies.js"></script>
<script>
const q=new URLSearchParams(location.search);
ti.textContent=q.get("t")||"Bonjour";la.textContent=q.get("l")||"";
const tick=()=>{const d=new Date();clock.textContent=String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")};tick();setInterval(tick,10000);
play(q.get("m")||"Berceuse des nuages",25); // le volume monte tout doucement en 25 s
const A=window.Android;
ok.onclick=()=>{stop();A&&A.stop()};sn.onclick=()=>{stop();A&&A.snooze()};
</script></body></html>
